<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE DISTINCT 5 Ltd | Site Under Maintenance</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #0a1d38;
    --steel: #1d4e89;
    --paper: #f6f7f9;
    --line: rgba(255,255,255,0.16);
    --ink-soft: rgba(255,255,255,0.72);
    --font-display: 'Archivo', Arial, sans-serif;
    --font-body: 'Inter', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--navy);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Company logo, large and softened, filling the background in its real colours */
  .bg-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(1400px, 170vw);
    transform: translate(-50%, -50%);
    opacity: 0.16;
    filter: blur(1px);
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .veil {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(10,29,56,0.45), rgba(10,29,56,0.94) 68%);
    z-index: 1;
  }

  .card {
    position: relative;
    z-index: 2;
    max-width: 560px;
    width: 100%;
    margin: 24px;
    padding: 56px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(2px);
  }
  .card > * {
    margin: 0;
  }
  .card > * + * {
    margin-top: 24px;
  }

  .mark {
    display: inline-flex;
    background: #fff;
    padding: 14px 22px;
  }
  .mark img {
    display: block;
    height: 34px;
    width: auto;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(26px, 4vw, 36px);
    line-height: 1.25;
    letter-spacing: -0.4px;
  }

  p {
    color: var(--ink-soft);
    font-size: 15.5px;
    line-height: 1.65;
    max-width: 440px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #ffd580;
    border: 1px solid rgba(255,213,128,0.35);
    padding: 10px 18px;
  }
  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffd580;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--line);
  }

  .contact {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: #9fb8dd;
    letter-spacing: 0.3px;
  }
  .contact a { color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.35); }
  .contact a:hover { border-color: transparent; }

  @media (max-width: 560px) {
    .card { padding: 40px 26px; }
    .card > * + * { margin-top: 20px; }
  }
</style>
</head>
<body>
  <img class="bg-logo" src="company_logo.png" alt="" />
  <div class="veil"></div>

  <main class="card">
    <div class="mark">
      <img src="company_logo.png" alt="THE DISTINCT 5 Ltd" />
    </div>
    <div class="status"><span class="dot"></span> Scheduled Maintenance</div>
    <h1>Our site is currently down for maintenance.</h1>
    <p>
      We're making some improvements behind the scenes. We'll be back online shortly
      thank you for your patience.
    </p>
    <div class="divider"></div>
    <div class="contact">
      Business Consultancy &amp; Advisory &middot; UK &middot; +44 (0) 75 2185 9459 &middot; <a href="mailto:support@thedistinct5ltd.com">
        support@thedistinct5ltd.com
      </a>
    </div>
  </main>
</body>
</html>
