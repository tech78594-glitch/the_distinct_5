# ============================================================
# GitHub Pages — THE DISTINCT 5 Ltd static site
# Deploys on every push to main.
# Requires: Settings → Pages → Source = "GitHub Actions"
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1 — Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2 — Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3 — Upload the static site as a Pages artifact
      #     Adjust `path` below if your HTML lives in a sub-folder (e.g. "dist")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."          # repo root — change to "dist" etc. if needed

      # 4 — Deploy
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
